<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A simple, responsive todo application to explore GitHub Copilot usage patterns" />
    <title>Todo App</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main>
      <!-- Header Section -->
      <header>
        <h1>My Todos</h1>
      </header>

      <!-- Input Form Section -->
      <section class="input-section">
        <form id="todo-form">
          <div class="form-group">
            <label for="todo-input">Add a new todo</label>
            <input
              type="text"
              id="todo-input"
              placeholder="What needs to be done?"
              required
              aria-label="Add a new todo"
            />
          </div>
          <button type="submit" class="btn-primary">Add</button>
        </form>
      </section>

      <!-- Filter Section -->
      <section class="filter-section">
        <h2 class="sr-only">Filter todos</h2>
        <div class="filter-buttons">
          <button class="filter-btn active" data-filter="all">
            All
          </button>
          <button class="filter-btn" data-filter="active">
            Active
          </button>
          <button class="filter-btn" data-filter="completed">
            Completed
          </button>
        </div>
      </section>

      <!-- Stats Display Section -->
      <section class="stats-section" aria-live="polite" aria-atomic="true">
        <h2 class="sr-only">Todo statistics</h2>
        <div class="stats">
          <div class="stat-item">
            <span class="stat-label">Total:</span>
            <span class="stat-value" id="total-count">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Active:</span>
            <span class="stat-value" id="active-count">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">Completed:</span>
            <span class="stat-value" id="completed-count">0</span>
          </div>
        </div>
      </section>

      <!-- Empty State Message -->
      <div id="empty-state" class="empty-state" role="status" aria-live="polite">
        <p>No todos yet. Add one to get started!</p>
      </div>

      <!-- Todo List Container -->
      <section class="list-section">
        <h2 class="sr-only">Todo list</h2>
        <ul id="todo-list" class="todo-list" aria-label="Todo items" role="list">
          <!-- Todo items will be inserted here dynamically -->
        </ul>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
